[package]
name = "survival2d"
version = "0.1.0"
edition = "2021"

#[workspace]
#resolver = "2" # Important! wgpu/Bevy needs this!
#
## Enable a small amount of optimization in debug mode
#[profile.dev]
#opt-level = 1
#
## Enable high optimizations for dependencies (incl. Bevy), but not for our code:
#[profile.dev.package."*"]
#opt-level = 3

[dependencies]
bevy = "0.13.1"
bevy_pancam = "0.11.0"
kd-tree = "0.5.3"
rand = "0.8.5"
typenum = "1.17.0"